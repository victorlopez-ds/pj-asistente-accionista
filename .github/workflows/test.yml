name: Tests

on:
  pull_request:
    branches: [ "main" ]

  push:
    branches: ["dev"]


jobs:
  test:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Debug runner structure
      run: |
        pwd
        ls -la
        python -c "import sys; print('PYTHONPATH/sys.path:', sys.path)"
    
    - name: Test with pytest
      env:
        PYTHONPATH: src
      run: |
        python -m pytest tests/

